<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>FenonTech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Corrige viewport quando teclado mobile fecha
      (function() {
        let lastHeight = window.innerHeight;
        
        function resetViewport() {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
          
          // Reset zoom
          const viewport = document.querySelector('meta[name=viewport]');
          if (viewport) {
            viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
          }
        }
        
        // Detecta quando teclado fecha (altura da janela aumenta)
        window.visualViewport && window.visualViewport.addEventListener('resize', function() {
          const currentHeight = window.visualViewport.height;
          if (currentHeight > lastHeight) {
            // Teclado fechou
            setTimeout(resetViewport, 100);
          }
          lastHeight = currentHeight;
        });
        
        // Fallback para navegadores sem visualViewport
        document.addEventListener('focusout', function() {
          setTimeout(resetViewport, 300);
        });
      })();
    </script>
  </body>
</html>
